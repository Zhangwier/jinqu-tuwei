<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>禁区突围 操作测试</title>
<style>body{margin:0;background:#222;color:#eee}canvas{width:360px;height:640px}</style></head>
<body>
  <canvas id="game"></canvas>
  <pre id="out">running</pre>
  <script src="../js/data.js"></script>
  <script src="../js/board.js"></script>
  <script src="../js/sim.js"></script>
  <script src="../js/ai.js"></script>
  <script src="../js/render.js"></script>
  <script src="../js/vfx.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // 用合成指针事件模拟拖放，结果写进 #out。无头跑法：
    // msedge --headless=new --dump-dom "http://127.0.0.1:8731/test/ui_test.html"
    const out = [], fails = [];
    const check = (ok, name) => (ok ? out.push('✓ ' + name) : (fails.push(name), out.push('✗ ' + name)));
    (async () => { try {
      localStorage.setItem('jq_tut', '1');
      const j = window.__jq; j.newGame();
      const g = j.game, s = g.sides[0];
      s.buns = 500;
      const cv = document.getElementById('game');
      const ev = (type, x, y, pt) => {
        const R = cv.getBoundingClientRect(), V = JQ.VIEW; // 画布铺满屏幕，逻辑区四周有留白
        cv.dispatchEvent(new PointerEvent(type, { clientX: R.left + ((x + V.padX) / (720 + 2 * V.padX)) * R.width, clientY: R.top + ((y + V.padY) / (1280 + 2 * V.padY)) * R.height, bubbles: true, pointerId: 1, pointerType: pt || 'mouse' }));
      };
      const drag = (a, b, pt) => { ev('pointerdown', ...a, pt); ev('pointermove', (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, pt); ev('pointermove', ...b, pt); ev('pointerup', ...b, pt); };
      const tap = (a) => { ev('pointerdown', ...a); ev('pointerup', ...a); };
      const sr = (i) => { const r = JQ.shopRect(i); return [r.x + r.w / 2, r.y + r.h / 2]; };
      const cr = (r, c) => { const x = JQ.cellRect(0, r, c); return [x.cx, x.cy]; };
      const mk = (k, key) => JQ.makeCard(k, key);
      const B = s.board;

      s.shop = [mk('unit', '刀'), mk('unit', '刀'), mk('unit', '弓'), mk('char', '张'), mk('char', '飞')];
      drag(sr(0), sr(1));
      check(!s.shop[0] && s.shop[1].level === 2, '备战席拖动合成升级');
      drag(sr(1), cr(0, 2));
      check(B.cell(0, 2).card && B.cell(0, 2).card.level === 2, '拖上场');
      // 松手点在水晶格偏右：吸附到右边空格 (0,4)，不会去顶替左边的刀
      drag(sr(2), [cr(0, 3)[0] + 25, cr(0, 3)[1]]);
      check(B.cell(0, 4).card && B.cell(0, 4).card.key === '弓' && B.cell(0, 2).card.key === '刀', '吸附到最近空格、不误替换');
      s.shop[2] = mk('unit', '盾');
      drag(sr(2), cr(0, 2));
      check(B.cell(0, 2).card.key === '盾' && s.shop[2] && s.shop[2].key === '刀', '正对场上卡=替换，被换下的回备战席');
      drag(cr(0, 2), sr(0));
      check(!B.cell(0, 2).card && s.shop[0] && s.shop[0].key === '盾', '场上卡拖回备战席空位');
      drag(sr(3), cr(1, 2)); drag(sr(4), cr(1, 3));
      check(B.links.some((l) => l.hero === '张飞'), '两字左右相邻成英雄');
      s.shop[4] = mk('char', '飞');
      drag(sr(4), cr(1, 2));
      check(B.links[0].level === 2, '同字拖到英雄身上升级');
      // 点选场上卡再点备战席空位 = 收回
      const before = s.shop.filter(Boolean).length;
      tap(cr(0, 4)); tap(sr(4));
      check(s.shop[4] && s.shop[4].key === '弓' && s.shop.filter(Boolean).length === before + 1, '点选场上卡再点备战席=收回');
      // 招兵：先卖备战席
      const bv = g.sellValue ? s.shop.reduce((t, c) => t + g.sellValue(c), 0) : 0;
      const buns0 = s.buns, cost = s.recruitCost();
      tap([JQ.UI.recruit.x + 60, JQ.UI.recruit.y + 40]);
      check(Math.round(s.buns) === Math.round(buns0 + bv - cost), `招兵自动卖备战席 +${bv}`);
      // 双击卖卡：默认关，打开后双击场上卡卖掉
      B.cell(0, 4).card = mk('unit', '剑'); B.rebuild();
      tap(cr(0, 4)); tap(cr(0, 4));
      check(!!B.cell(0, 4).card, '双击卖卡默认关闭');
      j.setDblSell(true);
      tap(cr(0, 4)); tap(cr(0, 4));
      check(!B.cell(0, 4).card, '打开后双击场上卡直接卖');
      j.setDblSell(false);
      // 拖到包子单卖
      s.shop[0] = mk('unit', '剑');
      const b1 = s.buns;
      drag(sr(0), [JQ.UI.bun.x + 37, JQ.UI.bun.y + 40]);
      check(s.buns === b1 + 1 && !s.shop[0], '备战席 1 级卡拖到包子单卖 +1');
      // 触屏抬高落点：手指在格子下方 46px
      s.shop[0] = mk('unit', '枪');
      const [x, y] = cr(1, 4);
      drag(sr(0), [x, y + 46], 'touch');
      check(B.cell(1, 4).card && B.cell(1, 4).card.key === '枪', '触屏落点抬高');
      // 突破活动：材料、突破、活动关
      j.openActivity();
      check(j.screen === 'activity', '活动页打开');
      j.giveMats(20, 10);
      const b0 = j.brkOf('吕布'), r0 = j.brkUp('吕布');
      check(r0.ok && j.brkOf('吕布') === b0 + 1, '材料足够时突破成功');
      check(j.prog.act.stone === 18 && j.prog.act.seal['吕布'] === 9, '突破扣除材料');
      j.giveMats(0, 99);
      while (j.brkOf('吕布') < 3 && j.brkUp('吕布').ok);
      check(j.brkOf('吕布') === 3, '三次突破上限');
      j.startActivityStage('hulaoguan');
      check(j.game.modeKey === 'breakthrough' && j.game.activity === 'hulaoguan', '活动关模式');
      check(j.game.sides[0].board.links.some((l) => l.hero === '吕布' && l.level === 3), '活动关送 3 级吕布');
      check(j.game.brkDefs['吕布'] && j.game.brkDefs['吕布'].ult.name === '神鬼乱舞', '突破定义进入战斗');
      // 测试场：英雄点一次上场、再点一次取消；小兵可以重复放
      j.openTestLab();
      const has = (k) => j.test.blue.filter((e) => e.key === k).length;
      if (has('关羽')) j.addTest('hero', '关羽'); // 先清掉，保证从 0 开始
      while (j.test.blue.length > 5) j.addTest('hero', j.test.blue.find((e) => e.kind === 'hero') ? j.test.blue.find((e) => e.kind === 'hero').key : '关羽');
      j.addTest('hero', '关羽');
      check(has('关羽') === 1, '测试场点英雄上场');
      j.addTest('hero', '关羽');
      check(has('关羽') === 0, '再点一次取消上场（不会重复放）');
      const u0 = has('刀');
      j.addTest('unit', '刀');
      j.addTest('unit', '刀');
      check(has('刀') === u0 + 2, '小兵可以重复放');

      // 第一关新手引导：拖卡 → 看召兵 → 招兵 → 合英雄 → 结束
      localStorage.removeItem('jq_tut');
      j.setScreen('menu');
      await new Promise((r) => setTimeout(r, 150)); // 让主菜单画一帧，清掉活动关状态
      j.newGame();
      j.startTutorial();
      const tg = j.game, ts = tg.sides[0];
      check(j.tut && j.tut.step === 0, '新手引导开始');
      const t0 = tg.time;
      await new Promise((r) => setTimeout(r, 300));
      check(tg.time === t0, '引导等待时战斗暂停');
      const si = ts.shop.findIndex((c) => c && c.kind === 'unit');
      const empty = ts.board.all().filter((x) => x.unlocked && !x.crystal && !x.card && x.r >= 0);
      tg.take(0, si, empty[0].r, empty[0].c);
      check(j.tut && j.tut.step === 1, '拖卡后进入下一步');
      j.tutNext();
      tg.recruit(0);
      check(j.tut && j.tut.step === 3 && ts.shop[0] && ts.shop[0].kind === 'char', '招兵后塞入英雄字卡');
      const hero = j.tut.hero, cells = ts.board.all().filter((x) => x.unlocked && !x.crystal && !x.card && x.r >= 0);
      const pair = cells.find((a) => cells.some((b) => b.r === a.r && b.c === a.c + 1));
      if (pair) (tg.take(0, 0, pair.r, pair.c), tg.take(0, 1, pair.r, pair.c + 1));
      await new Promise((r) => setTimeout(r, 200));
      check(ts.board.links.some((l) => l.hero === hero) && j.tut && j.tut.step === 4, '两字并排合成英雄');
      j.tutNext();
      check(!j.tut && localStorage.getItem('jq_tut') === '1', '引导结束并记住');
      j.setQx({ tokens: 0, pity: 0, freeDay: '', owned: {}, equip: {}, yayun: 0 });
      j.openQiuxian();
      check(j.screen === 'qiuxian', '求贤页打开');
      check(j.qxDraw(1) && j.prog.qx.tokens === 0 && j.prog.qx.freeDay, '每日免费一次不扣求贤令');
      j.qxReset();
      check(!j.qxDraw(1), '免费用完且没有求贤令时不能抽');
      j.setQx({ tokens: 30, pity: 0 });
      for (let i = 0; i < 3; i++) (j.qxReset(), j.qxDraw(10));
      const own = Object.keys(j.prog.qx.owned);
      check(j.prog.qx.tokens === 0 && own.length >= 1, '30 抽保底必出皮肤');
      const sk = JQ.SKIN_BY_ID[own[0]];
      check(j.prog.qx.equip[sk.hero] === sk.id, '第一款皮肤自动穿上');
      j.qxReset();
      const other = JQ.SKINS.find((x) => !j.prog.qx.owned[x.id]);
      j.setQx({ yayun: 120 });
      check(j.qxExchange(other.id) && j.prog.qx.owned[other.id] && j.prog.qx.yayun === 0, '雅韵兑换指定皮肤');
      j.qxReset();
      j.setQx({ equip: { 吕布: 'lvbu_chitu' }, owned: Object.assign({}, j.prog.qx.owned, { lvbu_chitu: true }) });
      j.startActivityStage('hulaoguan');
      check(j.game.brkDefs['吕布'].skin === 'lvbu_chitu' && j.game.brkDefs['吕布'].ult.name === '赤兔·焚原', '皮肤 + 突破进入战斗（二突后用皮肤进化大招）');
    } catch (e) {
      fails.push('异常 ' + e.message);
      out.push(e.stack);
    }
    document.getElementById('out').textContent = (fails.length ? 'FAIL ' + fails.length : 'PASS') + '\n' + out.join('\n');
    })();
  </script>
</body>
</html>
